name: AAB Handoff Event Gate

on:
  issue_comment:
    types: [created]
  push:
    branches:
      - HEAD
    paths:
      - .github/scripts/aab_queue_writer.py
      - .github/scripts/test_aab_queue_writer.py
      - .github/workflows/aab-handoff-event-gate.yml

permissions:
  contents: read

concurrency:
  group: aab-handoff-${{ github.event.comment.id || github.sha }}
  cancel-in-progress: false

jobs:
  queue-unit-tests:
    if: ${{ github.event_name == 'push' }}
    name: Synthetic queue safety checks (no external writes)
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run synthetic no-network queue tests
        run: python3 -m unittest discover -v -s .github/scripts -p 'test_aab_queue_writer.py'
      - name: Read-only GitHub token endpoint probe (no comments or writes)
        env:
          PROBE_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request
          endpoints = [
              ("source-comment", "https://api.github.com/repos/someonee12345678-hue/aab-queue/issues/comments/6233858121", 200),
              ("queue-readme", "https://api.github.com/repos/someonee12345678-hue/aab-queue/contents/channel/handoffs/README.md?ref=mc/channel", 200),
          ]
          failures = 0
          for label, url, expected in endpoints:
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["PROBE_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "AAB-ReadOnly-Diagnostics/1",
              })
              reason = ""
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      code = response.status
              except urllib.error.HTTPError as error:
                  code = error.code
                  try:
                      error_data = __import__("json").loads(error.read(2048).decode("utf-8"))
                      reason = str(error_data.get("message", ""))[:180]
                  except (ValueError, UnicodeError):
                      reason = "response message unavailable"
              print(f"{label}: HTTP {code} (expected {expected}) reason={reason}")
              if code != expected:
                  failures += 1
          if failures:
              raise SystemExit(1)
          PY

  classify:
    if: ${{ github.event_name == 'issue_comment' && github.repository == 'someonee12345678-hue/aab-queue' && github.event.issue.number == 2 && github.event.issue.pull_request != null }}
    permissions:
      contents: write
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout default-branch read-only validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Classify incoming comment event (never execute comment data)
        run: python3 .github/scripts/aab_event_gate.py "$GITHUB_EVENT_PATH"
      - name: Save structured read-only classification
        uses: actions/upload-artifact@v4
        with:
          name: aab-handoff-event-${{ github.event.comment.id }}
          path: aab-handoff-event-report.json
          retention-days: 2
          if-no-files-found: error
      - name: Create-only source-verified handoff queue record
        env:
          AAB_GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/aab_queue_writer.py aab-handoff-event-report.json
